openapi: 3.1.0
info:
  title: Guido API
  version: 0.1.0
  description: API pública inicial do Guido. Conteúdo demonstrativo é explicitamente marcado.
servers:
  - url: http://127.0.0.1:8080
    description: Desenvolvimento local
paths:
  /healthz:
    get:
      operationId: health
      summary: Verifica se o processo HTTP está ativo
      responses:
        "200":
          description: Processo ativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: readiness
      summary: Verifica se a instância pode receber tráfego
      responses:
        "200":
          description: Instância pronta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/applications:
    get:
      operationId: listApplications
      summary: Lista aplicativos visíveis no catálogo
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Página de aplicativos
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Application" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
  /api/v1/applications/{slug}:
    get:
      operationId: getApplication
      summary: Obtém um aplicativo pelo slug
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Aplicativo encontrado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/applications/{slug}/tutorials:
    get:
      operationId: listApplicationTutorials
      summary: Lista tutoriais de um aplicativo
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Tutoriais encontrados
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Tutorial" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tutorials/{slug}:
    get:
      operationId: getTutorialGuide
      summary: Obtém o guia de um tutorial para a plataforma solicitada
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: platform
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Platform" }
      responses:
        "200":
          description: Guia encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideEnvelope" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/guides/{id}:
    get:
      operationId: getGuide
      summary: Obtém um guia pela identificação
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[a-zA-Z0-9-]+$", maxLength: 100 }
      responses:
        "200":
          description: Guia encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideEnvelope" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/search:
    get:
      operationId: searchTutorials
      summary: Pesquisa tutoriais por título, descrição e termos
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Resultados da busca
          content:
            application/json:
              schema:
                type: object
                required: [items, returned]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Tutorial" }
                  returned: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/InvalidRequest" }
  /api/v1/me/progress/{guideId}:
    parameters:
      - name: guideId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 100 }
    get:
      operationId: getMyProgress
      summary: Obtém o progresso do usuário autenticado
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Progresso encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: saveMyProgress
      summary: Cria ou atualiza o progresso de forma idempotente
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentStep, status]
              properties:
                currentStep: { type: integer, minimum: 0, maximum: 499 }
                status: { $ref: "#/components/schemas/ProgressStatus" }
      responses:
        "200":
          description: Progresso salvo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressEnvelope" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50 }
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0 }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 100 }
  responses:
    InvalidRequest:
      description: Parâmetro inválido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ServiceUnavailable:
      description: Dependência necessária não configurada ou indisponível
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    PublicationStatus:
      type: string
      enum: [draft, under_review, published, outdated]
    Platform:
      type: string
      enum: [android, ios]
    ProgressStatus:
      type: string
      enum: [not_started, in_progress, completed]
    Health:
      type: object
      required: [status, service]
      properties:
        status: { const: ok }
        service: { const: guido-api }
    Readiness:
      type: object
      required: [status, repository]
      properties:
        status: { const: ready }
        repository: { type: string }
    Pagination:
      type: object
      required: [limit, offset, returned]
      properties:
        limit: { type: integer, minimum: 1, maximum: 50 }
        offset: { type: integer, minimum: 0 }
        returned: { type: integer, minimum: 0 }
    Application:
      type: object
      required: [id, name, slug, description, category, logoUrl, status]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        category: { type: string }
        logoUrl: { type: [string, "null"], format: uri }
        status: { $ref: "#/components/schemas/PublicationStatus" }
    Tutorial:
      type: object
      required: [id, applicationId, applicationName, title, slug, description, difficulty, safetyWarning, searchTerms, status, isDemo]
      properties:
        id: { type: string }
        applicationId: { type: string }
        applicationName: { type: string }
        title: { type: string }
        slug: { type: string }
        description: { type: string }
        difficulty: { type: string, enum: [easy, medium, advanced] }
        safetyWarning: { type: string }
        searchTerms: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/PublicationStatus" }
        isDemo: { type: boolean }
    GuideVersion:
      type: object
      required: [id, tutorialId, platform, appVersion, guideVersion, lastReviewedAt, status, estimatedMinutes]
      properties:
        id: { type: string }
        tutorialId: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        appVersion: { type: string }
        guideVersion: { type: string }
        lastReviewedAt: { type: [string, "null"], format: date-time }
        status: { $ref: "#/components/schemas/PublicationStatus" }
        estimatedMinutes: { type: integer, minimum: 1 }
    GuideStep:
      type: object
      required: [id, guideId, order, title, instruction, imageUrl, imageAlt, audioUrl, warning, confirmationMessage]
      properties:
        id: { type: string }
        guideId: { type: string }
        order: { type: integer, minimum: 1 }
        title: { type: string }
        instruction: { type: string }
        imageUrl: { type: [string, "null"], format: uri }
        imageAlt: { type: string }
        audioUrl: { type: [string, "null"], format: uri }
        warning: { type: [string, "null"] }
        confirmationMessage: { type: [string, "null"] }
    GuideEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [application, tutorial, guide, steps]
          properties:
            application: { $ref: "#/components/schemas/Application" }
            tutorial: { $ref: "#/components/schemas/Tutorial" }
            guide: { $ref: "#/components/schemas/GuideVersion" }
            steps:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/GuideStep" }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    UserProgress:
      type: object
      required: [guideId, currentStep, status, lastAccessedAt, completedAt]
      properties:
        guideId: { type: string }
        currentStep: { type: integer, minimum: 0, maximum: 499 }
        status: { $ref: "#/components/schemas/ProgressStatus" }
        lastAccessedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    ProgressEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/UserProgress" }
