name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Preparar banco efêmero
        env:
          PGPASSWORD: postgres
        run: |
          # O PostgreSQL efêmero não instala o serviço Storage; esta função reproduz
          # somente a semântica que as policies usam para validar a primeira pasta.
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "create schema auth; create table auth.users (id uuid primary key, raw_user_meta_data jsonb not null default '{}'::jsonb); create function auth.uid() returns uuid language sql stable as 'select nullif(current_setting(''request.jwt.claim.sub'', true), '''')::uuid'; create role anon nologin; create role authenticated nologin; create schema storage; create table storage.buckets (id text primary key, name text not null, public boolean not null default false, file_size_limit bigint, allowed_mime_types text[]); create table storage.objects (id uuid, bucket_id text not null, name text not null); create function storage.foldername(name text) returns text[] language sql immutable as 'select (string_to_array(name, ''/''))[1:array_length(string_to_array(name, ''/''), 1) - 1]'; alter table storage.objects enable row level security; grant usage on schema storage to anon, authenticated; grant select, insert on storage.objects to anon, authenticated;"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/001_initial_schema.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/002_row_level_security.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/003_profiles_trigger.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/004_supabase_public_access.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/005_restrict_auth_trigger_execution.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/006_document_auth_profile_trigger.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/007_shared_guide_image_drafts.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/008_admin_published_guide_images.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/009_refresh_demo_boleto_steps.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/010_restrict_guide_publishing_to_superadmin.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260820055619_allow_authenticated_guide_image_uploads.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Validar isolamento e demonstração
        env:
          PGPASSWORD: postgres
        run: |
          test "$(psql -h 127.0.0.1 -U postgres -Atqc "set role anon; select count(*) from public.tutorials where slug = 'pagar-boleto';")" = "1"
          if psql -h 127.0.0.1 -U postgres -Atqc "set role anon; select count(*) from public.team_members;" >/dev/null 2>&1; then
            echo "anon obteve acesso indevido a team_members" >&2
            exit 1
          fi
          if psql -h 127.0.0.1 -U postgres -Atqc "set role anon; select count(*) from public.guide_image_drafts;" >/dev/null 2>&1; then
            echo "anon obteve acesso indevido aos rascunhos" >&2
            exit 1
          fi
      - name: Validar autorização dos rascunhos compartilhados
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "insert into auth.users (id, raw_user_meta_data) values ('11111111-1111-4111-8111-111111111111', '{\"name\":\"Editor\"}'), ('22222222-2222-4222-8222-222222222222', '{\"name\":\"Usuário\"}'); insert into public.team_members (user_id, role) values ('11111111-1111-4111-8111-111111111111', 'editor');"
          test "$(psql -h 127.0.0.1 -U postgres -Atqc "select set_config('request.jwt.claim.sub', '22222222-2222-4222-8222-222222222222', false); set role authenticated; select count(*) from public.guide_image_drafts;" | tail -n 1)" = "0"
          if psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "select set_config('request.jwt.claim.sub', '22222222-2222-4222-8222-222222222222', false); set role authenticated; insert into public.guide_image_drafts (guide_slug, application_slug, operating_system, step_id, step_order, storage_key, original_filename, mime_type, byte_size, width, height, created_by, updated_by) values ('pagar-boleto', 'caixa', 'android', 'passo-1', 1, 'normal/negado.png', 'negado.png', 'image/png', 100, 1080, 1920, '22222222-2222-4222-8222-222222222222', '22222222-2222-4222-8222-222222222222');"; then
            echo "usuário sem vínculo conseguiu criar rascunho" >&2
            exit 1
          fi
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "select set_config('request.jwt.claim.sub', '11111111-1111-4111-8111-111111111111', false); set role authenticated; insert into public.guide_image_drafts (guide_slug, application_slug, operating_system, step_id, step_order, storage_key, original_filename, mime_type, byte_size, width, height, created_by, updated_by) values ('pagar-boleto', 'caixa', 'android', 'passo-1', 1, '11111111-1111-4111-8111-111111111111/pagar-boleto/caixa/android/passo-1/teste.png', 'teste.png', 'image/png', 100, 1080, 1920, '11111111-1111-4111-8111-111111111111', '11111111-1111-4111-8111-111111111111');"
          test "$(psql -h 127.0.0.1 -U postgres -Atqc "select set_config('request.jwt.claim.sub', '11111111-1111-4111-8111-111111111111', false); set role authenticated; select count(*) from public.guide_image_drafts;" | tail -n 1)" = "1"
      - name: Validar publicação imediata por visitantes sem login
        env:
          PGPASSWORD: postgres
        run: |
          test "$(psql -h 127.0.0.1 -U postgres -Atqc "set role anon; select count(*) from public.guide_public_images;")" = "0"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "set role anon; insert into public.guide_public_images (guide_slug, application_slug, operating_system, step_id, step_order, storage_key, original_filename, mime_type, byte_size, width, height, created_by, updated_by) values ('pagar-boleto', 'caixa', 'android', 'passo-1', 1, 'public/pagar-boleto/caixa/android/passo-1/publico.png', 'publico.png', 'image/png', 100, 1080, 1920, null, null);"
          test "$(psql -h 127.0.0.1 -U postgres -Atqc "set role anon; select count(*) from public.guide_public_images where guide_slug = 'pagar-boleto';")" = "1"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "set role anon; update public.guide_public_images set storage_key = 'public/pagar-boleto/caixa/android/passo-1/substituto.png', original_filename = 'substituto.png', updated_by = null where guide_slug = 'pagar-boleto';"
          test "$(psql -h 127.0.0.1 -U postgres -Atqc "select storage_key from public.guide_public_images where guide_slug = 'pagar-boleto';")" = "public/pagar-boleto/caixa/android/passo-1/substituto.png"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "set role anon; insert into storage.objects (id, bucket_id, name) values ('33333333-3333-4333-8333-333333333333', 'guide-public', 'public/pagar-boleto/caixa/android/passo-1/publico.png');"
          if psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "set role anon; insert into storage.objects (id, bucket_id, name) values ('44444444-4444-4444-8444-444444444444', 'guide-public', 'privado/arquivo.png');"; then
            echo "visitante conseguiu gravar fora da pasta publica no Storage" >&2
            exit 1
          fi
          test "$(psql -h 127.0.0.1 -U postgres -Atqc "set role anon; delete from public.guide_public_images where guide_slug = 'pagar-boleto'; select count(*) from public.guide_public_images where guide_slug = 'pagar-boleto';" | tail -n 1)" = "1"
