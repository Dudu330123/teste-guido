name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate-images
      - run: npm run perf:budget
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  # O banco/Supabase fica deliberadamente fora desta fase local. Quando a
  # integração for ativada, este job deve aplicar todas as migrations em ordem
  # e validar RLS; não se deve reintroduzir uma lista parcial de migrations.
